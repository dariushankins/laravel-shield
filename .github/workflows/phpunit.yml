name: PHPUnit

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [highest, lowest]

    name: PHP ${{ matrix.php }} / Laravel 13 / ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --no-progress
      - if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: composer check-platform-reqs
      - run: composer test -- --display-all-issues
